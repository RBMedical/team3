    body {
      font-family: 'Sarabun', sans-serif;
      margin: 0;
      background-image: url("pic/CheckUP.png");
    }

    /* Layout */
    .wrapper {
      display: flex;
      height: 100vh;
    }

     .nav-title {
      max-width: 760px;
    }

    .nav-kicker {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
    }

    .nav-title h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.06;
      color: var(--brand-deep);
    }

    .nav-title p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .sidebar {
      position: fixed;
      width: 20%;
      background-color: rgb(225, 232, 236);
      color: teal;
      padding: 20px;
      border-right: 1px solid #023636;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2),
        inset -2px 0 5px rgba(255, 255, 255, 0.1);
    }

    .print-area {
      width: 80%;
      padding: 20px;
      color: teal;
      overflow-x: hidden;
      margin-left: 400px;
      width: calc(100% - 400px);
    }

    .content {
      width: 80%;
      padding: 20px;
      overflow: hidden;
    }

    /* Table container */
    .table-container {
      width: 90%;
      margin: auto;
    }

    .table-scroll {
      max-height: 400px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid #dee2e6;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.60rem;
    }

    th,
    td {
      padding: 10px;
      text-align: center;
      border-right: 1px solid #dee2e6;
      border-bottom: 1px solid #dee2e6;
      font-size: 0.60rem;
    }

    th:last-child,
    td:last-child {
      border-right: none;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Sticky Header */
    thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #f8f9fa;
    }

    /* มุมโค้ง */
    thead th:first-child {
      border-top-left-radius: 10px;
    }

    thead th:last-child {
      border-top-right-radius: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu-item {
      padding: 12px 16px;
      color: #555;
      cursor: pointer;
      position: relative;
    }

    /* hover */
    .menu-item:hover {
      background-color: #f0f0f0;
    }

    /* active แบบในภาพ */
    .menu-item.active {
      background-color: #e6f4ef;
      /* เขียวอ่อน */
      color: #0f9d7a;
      /* เขียว */
      font-weight: 500;
    }

    /* เส้นด้านซ้าย */
    .menu-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background-color: #0f9d7a;
      /* สีเขียวเข้ม */
      border-radius: 0 4px 4px 0;
    }

    .logo-box {
      width: 60%;
      height: 80px;


      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* ไม่ยืดภาพ */
    }

    .headnav {
      display: flex;
      justify-content: space-between;
    }

    .navbar {
      justify-content: space-between;
    }

    .b-example-divider {
      width: 100%;
      height: 0.1rem;
      background-color: rgba(0, 0, 0, 0.1);
      border: solid rgba(0, 0, 0, .15);
      border-width: 1px 0;
      box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
    }

    @media print {

      .sidebar,
      .noprint,
      .btn {
        display: none !important;
      }

      .print-area {
        width: 100% !important;
        max-width: 100% !important;
        color: #000 !important;
        padding: 0 !important;
      }

      table {
        width: 100% !important;
        font-size: 10px !important;
      }

      th,
      td {
        padding: 6px !important;
        font-size: 10px !important;
        color: #000 !important;
      }

      .navbar {
        background: white !important;
        border-bottom: 2px solid #0f9d7a;
        margin-bottom: 10px;
      }
    }

    /* ปรับปรุงการแสดงผลตารางบนหน้าเว็บ */
    #mainTable {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Sarabun', 'Noto Sans Thai', Arial, sans-serif;
    }

    #mainTable th {
      background-color: #2c5f6e !important;
      color: white !important;
      padding: 10px 8px !important;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
    }

    #mainTable td {
      padding: 8px 6px;
      font-size: 13px;
      border: 1px solid #c8d6dc;
    }

    #mainTable tr:nth-child(even) {
      background-color: #f8fafc;
    }

    #mainTable .text-danger-custom {
      color: #c62828;
      font-weight: 700;
      background-color: #ffebee;
    }

    /* สำหรับการพิมพ์ PDF */
    @media print {
      body.exporting-pdf * {
        visibility: hidden;
      }

      body.exporting-pdf .pdf-capture,
      body.exporting-pdf .pdf-capture * {
        visibility: visible;
      }

      .pdf-capture {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
    }

    /* Responsive สำหรับหน้าจอเล็ก */
    @media (max-width: 768px) {
      #mainTable {
        font-size: 11px;
      }

      #mainTable th,
      #mainTable td {
        padding: 5px 3px;
      }
    }

    .navbar {
      display: flex !important;
      justify-content: space-between !important;
      align-items: stretch !important;
      border-radius: 10px;
    }

    .navbar h5 {
      margin: 0;
      font-weight: 600;
    }

    .navbar .icon-link {
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .table-result {
      border: 1px solid #000;
      border-collapse: collapse;
    }

    .table-result th,
    .table-result td {
      border: 1px solid #dee2e6;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 20%;
      height: 100vh;
      overflow-y: auto;

      /* เผื่อเมนูยาว */
      table {
        table-layout: fixed;
      }
    }


    /* ... ส่วนอื่นไม่เปลี่ยน ... */

    @media print {

      body,
      html {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }

      .sidebar,
      .noprint,
      .btn,
      .icon-link,
      #loading,
      .b-example-divider,
      .logo-box {
        display: none !important;
      }

      .wrapper {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .print-area {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 12px 15px !important;
        background: white !important;
        color: black !important;
        box-sizing: border-box !important;
      }

      /* บังคับตารางให้เต็ม A4 แนวนอน */
      .table-container,
      .table-responsive,
      .table {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: visible !important;
      }

      table,
      #mainTable {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: fixed !important;
        font-size: 9pt !important;
        border-collapse: collapse !important;
        word-wrap: break-word !important;
      }

      th,
      td {
        border: 1px solid #aaa !important;
        padding: 5px 4px !important;
        font-size: 8pt !important;
        text-align: center !important;
        vertical-align: middle !important;
      }

      td:first-child,
      th:first-child {
        width: 22mm !important;
      }

      td:nth-child(2),
      th:nth-child(2) {
        width: 38mm !important;
        text-align: left !important;
      }

      /* ป้องกันการตัดขอบ */
      * {
        box-shadow: none !important;
        transform: none !important;
      }

      .navbar {
        display: block !important;
        background: white !important;
        margin-bottom: 10px !important;
      }

      .navbar h5 {
        font-size: 14pt !important;
        margin-bottom: 5px !important;
      }
    }

    /* ... ส่วนอื่นไม่เปลี่ยน ... */

            function exportXCEL() {
  const table = document.getElementById("mainTable");

  if (!table) {
    alert("ไม่พบตารางสำหรับส่งออก Excel");
    return;
  }

  const workbook = XLSX.utils.book_new();

  const worksheet = XLSX.utils.table_to_sheet(table, {
    raw: true
  });

  XLSX.utils.book_append_sheet(workbook, worksheet, "Report");

  XLSX.writeFile(workbook, "รายงานผลตรวจสุขภาพ.xlsx");
}
function getPrintableTable() {
        return document.getElementById("mainTable") || document.querySelector(".table.table-result");
      }
      function getPrintableTitle() {
        const heading = document.querySelector(".navbar h5");
        if (heading) {
          return heading.textContent.replace(/\s+/g, " ").trim();
        }
        const navbar = document.querySelector(".navbar");
        if (!navbar) {
          return document.title || "Report";
        }
        const blocks = Array.from(navbar.querySelectorAll("div")).map(node =>
          node.textContent.replace(/\s+/g, " ").trim()
        ).filter(Boolean);
        return blocks[0] || document.title || "Report";
      }
      function getRowsPerPage(table) {
        const columnCount = table.querySelectorAll("thead tr:last-child th").length || 0;
        if (columnCount >= 17) return 18;
        if (columnCount >= 15) return 20;
        return 22;
      }
      function fitNameCell(cell) {
        const textLength = cell.textContent.trim().length;
        let fontSize = 8.4;
        if (textLength > 36) {
          fontSize = 7.1;
        } else if (textLength > 28) {
          fontSize = 7.6;
        } else if (textLength > 22) {
          fontSize = 8;
        }
        cell.style.fontSize = fontSize + "px";
        cell.style.whiteSpace = "nowrap";
        cell.style.overflow = "hidden";
        cell.style.textOverflow = "ellipsis";
      }
 function stylePrintableTable(table) {

  table.style.width = "100%";
  table.style.borderCollapse = "collapse";
  table.style.tableLayout = "fixed";

  // ลบ colgroup เดิม
  const oldColgroup = table.querySelector("colgroup");
  if (oldColgroup) oldColgroup.remove();

  // สร้าง colgroup ใหม่
  const colgroup = document.createElement("colgroup");

  /*
    ตารางจริงมี 13 คอลัมน์

    1 = 15%
    2 = 5%
    3 = 15%
    4-12 = 5%
    13 = 20%
  */

  const widths = [
    "5%",
    "14%",
    "7%",
    "14%",
    "5%",
    "5%",
    "5%",
    "5%",
    "5%",
    "5%",
    "5%",
    "5%",
    "20%"
  ];

  widths.forEach(width => {
    const col = document.createElement("col");
    col.style.width = width;
    colgroup.appendChild(col);
  });

  table.prepend(colgroup);

  // style ทุก cell
  Array.from(table.querySelectorAll("th, td")).forEach(cell => {

    cell.style.border = "1px solid #9fb3bf";

    cell.style.padding = "3px 4px";

    cell.style.fontSize = "7pt";

    cell.style.lineHeight = "1.15";

    cell.style.boxSizing = "border-box";

    cell.style.wordBreak = "break-word";

    cell.style.overflowWrap = "break-word";

    cell.style.verticalAlign = "middle";

    cell.style.textAlign = "center";
  });

  // header
  Array.from(table.querySelectorAll("thead th")).forEach(cell => {

    cell.style.background = "#dbeaf1";

    cell.style.fontWeight = "700";

    cell.style.fontSize = "7pt";

    cell.style.textAlign = "center";
  });

  // body
  Array.from(table.querySelectorAll("tbody tr")).forEach(row => {

    // คอลัมน์ 2 = ชื่อ
    const nameCell = row.children[1];

    if (nameCell) {

      nameCell.style.textAlign = "left";

      nameCell.style.fontSize = "6.7pt";

      nameCell.style.whiteSpace = "nowrap";

      nameCell.style.overflow = "hidden";

      nameCell.style.textOverflow = "ellipsis";
    }

    // คอลัมน์สุดท้าย
    const lastCell = row.children[12];

    if (lastCell) {

      lastCell.style.textAlign = "left";

      lastCell.style.whiteSpace = "normal";

      lastCell.style.fontSize = "6.4pt";

      lastCell.style.lineHeight = "1.05";
    }
  });
}
    
   function buildPrintableReport() {
  const table = getPrintableTable();
  if (!table) return null;

  const tbody = table.querySelector("tbody");
  if (!tbody) return null;

  const rows = Array.from(tbody.querySelectorAll("tr"));
  if (rows.length === 0) return null;

  const root = document.createElement("div");

  root.style.width = "100%";
  root.style.maxWidth = "1123px";
  root.style.margin = "0 auto";
  root.style.fontFamily = "'Sarabun', sans-serif";
  root.style.background = "#fff";

  const title = getPrintableTitle();
  const selectedValue = (document.getElementById("selectedValue")?.textContent || "").trim();
  const printedAt = new Date().toLocaleString("th-TH");

  const report = document.createElement("div");
  report.style.padding = "8mm 10mm 8mm 10mm";
  report.style.width = "100%";
  report.style.boxSizing = "border-box";

  const header = document.createElement("div");
  header.style.display = "flex";
  header.style.justifyContent = "space-between";
  header.style.borderBottom = "2px solid #3c6e71";
  header.style.marginBottom = "3mm";
  header.style.breakAfter = "avoid";
  header.style.pageBreakAfter = "avoid";

  header.innerHTML = `
    <div>
      <div style="font-size:13px;font-weight:700;">${title}</div>
      <div style="font-size:9px;">${selectedValue}</div>
    </div>
    <div style="font-size:8px;text-align:right;">
      ${printedAt}
    </div>
  `;

  report.appendChild(header);

  const pageTable = table.cloneNode(true);
  pageTable.style.width = "100%";
  pageTable.style.tableLayout = "fixed";
  pageTable.style.borderCollapse = "collapse";

  stylePrintableTable(pageTable);

  report.appendChild(pageTable);
  root.appendChild(report);

  return root;
}

      function showLoading() {
        document.getElementById("loading").style.display = "flex";

      function hideLoading() {
        document.getElementById("loading").style.display = "none";

      function fetchJson(url) {
        return fetch(url).then(response => {
          if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
          }
          return response.json();
        });
      }

      function isAbnormal(value) {
        if (!value) return false;

        const text = String(value).trim();

        return text === "ผิดปกติ" || text.includes("H");
      }

      function loadAllRecords() {
        const resultDiv1 = document.getElementById("cbcresult");
        const selectedText = document.getElementById("selectedValue");

        if (resultDiv1) {
          resultDiv1.innerHTML = "";
        }

        const selectedValue = String(
          localStorage.getItem("selectedCustomer") ||
          localStorage.getItem("selectedDropdownValue") ||
          ""
        ).trim();

        console.log("Selected Value:", selectedValue);

        if (selectedText) {
          selectedText.innerText = selectedValue;

        if (!selectedValue) {
          if (resultDiv1) {
            resultDiv1.innerHTML = `
            <tr>
              <td colspan="17" class="text-center text-danger">ไม่พบข้อมูลผู้ใช้ กรุณาเข้าสู่ระบบใหม่</td>
            </tr>
          `;
          }
          return;
        }

        showLoading();

        fetchJson(BASE_URL + "?app=eye&type=main")
          .then(data => {
            console.log("Data received from API:", data);

            if (!Array.isArray(data) || data.length === 0) {
              if (resultDiv1) {
                resultDiv1.innerHTML = `
                <tr>
                  <td colspan="17" class="text-center text-danger">ไม่พบข้อมูล</td>
                </tr>
              `;
              }
              hideLoading();
              return;
            }

            let found = false;

            data.forEach(row => {
              if (String(row.customer || "").trim() === selectedValue) {
                found = true;
                resultDiv1.innerHTML += `
                <tr >
                 <td class="id-col" style="font-size: 0.60rem;">${row.hn || ""}</td>
                   <td class="text-start" style="font-size: 0.60rem;">${row.name || ""}</td>

                    <td style="font-size: 0.6rem;" class="text-center ${isAbnormal(row.v4) ? 'text-danger-custom' : ''}">${row.v4 || ""} </td>

                      <td style="font-size: 0.6rem;" class="text-center ${isAbnormal(row.v6) ? 'text-danger-custom' : ''}">${row.v6 || ""} </td>
                      <td style="font-size: 0.6rem;" class="text-center ${isAbnormal(row.v7) ? 'text-danger-custom' : ''}">${row.v7 || ""} </td>
                        <td class="text-start" style="font-size: 0.60rem;">${row.result || ""}</td>
                </tr>
              `;
              }
            });

           if (!found && resultDiv1) {
              resultDiv1.innerHTML = `
              <tr>
                <td colspan="17" class="text-center text-danger">ไม่พบข้อมูลของผู้ใช้ที่เลือก</td>

            `;
            }

            hideLoading();
          });
      }

      const label = document.createElement("span");
      label.className = "menu-label";

      const icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = item.open ? "−" : "+";

      label.appendChild(icon);
      label.appendChild(document.createTextNode(item.text));

      const childMenu = createMenu(item.children);
      childMenu.className = "child-menu";

      if (item.open) {
        childMenu.classList.add("open");
      }

      label.onclick = function () {
        childMenu.classList.toggle("open");

        if (childMenu.classList.contains("open")) {
          icon.textContent = "−";
        } else {
          icon.textContent = "+";
        }
      };

      li.appendChild(label);
      li.appendChild(childMenu);

    } else {
      const a = document.createElement("a");
a.href = item.link;
a.textContent = item.text; // ✅ แสดงเฉพาะชื่อ
li.appendChild(a);
    }

    ul.appendChild(li);
  });

  return ul;
}

document.addEventListener("DOMContentLoaded", function () {
  const menuBox = document.getElementById("dynamicMenu");
  if (!menuBox) return;

  menuBox.innerHTML = "";
  menuBox.appendChild(createMenu(menuData));

  const currentPage = window.location.pathname.split("/").pop() || "xray.html";
  menuBox.querySelectorAll("a").forEach(a => {
    const hrefPage = a.getAttribute("href");
    if (hrefPage === currentPage) {
      a.classList.add("active");

      let parent = a.parentElement;
      while (parent && parent !== menuBox) {
        if (parent.classList && parent.classList.contains("child-menu")) {
          parent.classList.add("open");

          const label = parent.previousElementSibling;
          if (label) {
            const icon = label.querySelector(".icon");
            if (icon) icon.textContent = "−";
          }
        }
        parent = parent.parentElement;
      }
    }
  });
});

</script>
