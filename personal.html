<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="stylesheet" href="transition.css">
  <script src="AppScript.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">

<link rel="apple-touch-icon" href="/icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mobile Checkup">

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบค้นหาผลการตรวจสุขภาพ</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink-900: #0b3d3a;
      --teal-700: #0e7c6f;
      --teal-600: #12a893;
      --teal-500: #17bfa6;
      --teal-tint: #e7f7f4;
      --bg: #eef3f4;
      --ink: #1f2d2b;
      --muted: #64777a;
      --line: #dfe7e6;
      --danger: #d1495b;
      --danger-tint: #fbe9ea;
      --card-radius: 16px;
      --shadow-sm: 0 1px 2px rgba(11, 61, 58, .06);
      --shadow-md: 0 8px 24px rgba(11, 61, 58, .08);
    }

    body {
      font-family: "Noto Sans Thai", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 0.95rem;
    }

    .page-wrap {
      padding-top: 16px;
      padding-bottom: 24px;
    }

    /* ---------- HEADER ---------- */
    .app-header {
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line);
      padding: 16px 20px;
      margin-bottom: 18px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--teal-600), var(--teal-700));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(18, 168, 147, .35);
    }

    .app-title {
      font-weight: 700;
      color: var(--ink-900);
      font-size: 1.02rem;
      line-height: 1.3;
    }

    .app-subtitle {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .header-tools input.form-control {
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .header-tools input.form-control:focus {
      border-color: var(--teal-600);
      box-shadow: 0 0 0 3px rgba(18, 168, 147, .15);
    }

    .btn-teal {
      background: var(--teal-600);
      border-color: var(--teal-600);
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
    }

    .btn-teal:hover {
      background: var(--teal-700);
      border-color: var(--teal-700);
      color: #fff;
    }

    .header-tools .btn-secondary,
    .header-tools .btn-outline-secondary {
      border-radius: 10px;
    }

    /* ---------- LAYOUT GRID ---------- */
    .results-grid {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .results-sidebar {
      flex: 0 0 40%;
      max-width: 40%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .results-main {
      flex: 0 0 60%;
      max-width: 60%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ---------- CARD ---------- */
    .info-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .patient-card .hospital-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .patient-card .hospital-row img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 10px;
      background: var(--teal-tint);
      padding: 4px;
    }

    .patient-card .hospital-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--ink-900);
    }

    .field-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      font-size: 0.8rem;
      margin-top: 6px;
    }

    .field-row .fw-bold {
      color: var(--muted);
      font-weight: 600 !important;
    }

    .field-row .col-auto:not(.fw-bold) {
      color: var(--ink);
      font-weight: 600;
    }

    .line-sep {
      border-bottom: 1px solid var(--line);
      margin: 12px 0;
    }

    .section-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--ink-900);
      margin-bottom: 12px;
      padding-left: 10px;
      border-left: 4px solid var(--teal-600);
      line-height: 1.1;
    }

    .doctor-note {
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--teal-tint);
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--ink-900);
    }

    .doctor-note .fw-bold {
      color: var(--teal-700);
    }

    /* ---------- TABLES ---------- */
    .table th,
    .table td {
      vertical-align: middle;
    }

    .table-sm-custom td,
    .table-sm-custom th {
      padding: .5rem .55rem;
      font-size: .83rem;
    }

    .info-card .table {
      margin-bottom: 0;
    }

    .info-card .table-secondary th {
      background: var(--teal-tint);
      color: var(--ink-900);
      font-weight: 700;
      border-color: var(--line);
    }

    .info-card .table td,
    .info-card .table th {
      border-color: var(--line);
    }

    .info-card .table tbody tr:hover {
      background: #f7fbfa;
    }

    .table td.text-danger:not(:empty),
    .table td.text-body-secondary:not(:empty) {
      font-weight: 700;
      border-radius: 8px;
    }

    .table td.text-danger:not(:empty) {
      color: var(--danger) !important;
      background: var(--danger-tint);
    }

    .table td.text-body-secondary:not(:empty) {
      color: var(--teal-700) !important;
    }

    .click-link {
      color: var(--teal-700);
      cursor: pointer;
      text-decoration: underline;
      font-weight: 600;
    }

    /* ---------- WAITING / MODALS ---------- */
    .modal-waiting {
      position: fixed;
      inset: 0;
      background: rgba(11, 61, 58, .12);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 16px;
    }

    .waiting-card {
      width: min(400px, 100%);
      background: rgba(255,255,255,.97);
      border-radius: var(--card-radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-md);
    }

    .custom-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 61, 58, .35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2500;
      padding: 12px;
    }

    .custom-modal {
      width: min(900px, 96vw);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: 0 18px 40px rgba(11, 61, 58, .25);
    }

    .custom-modal .modal-header,
    .custom-modal .modal-footer {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .custom-modal .modal-header {
      background: var(--teal-tint);
      border-radius: var(--card-radius) var(--card-radius) 0 0;
    }

    .custom-modal .modal-footer {
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .custom-modal .modal-body {
      padding: 14px 16px;
    }

    #urinetable,
    #cbctable {
      width: 100%;
      min-width: 520px;
    }

    .responsive-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    @media print {
      body {
        background: #fff;
        font-size: .8rem;
      }

      .noprint,
      .modal-waiting {
        display: none !important;
      }

      .custom-overlay {
        display: block !important;
        position: static !important;
        background: white !important;
        padding: 0 !important;
        margin-top: 20px;
      }

      .custom-modal {
        width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        box-shadow: none !important;
        border: 1px solid #ccc;
      }

      .btn-close {
        display: none !important;
      }

      .results-grid {
        display: block;
      }

      .results-sidebar {
        width: 100%;
      }

      .info-card {
        box-shadow: none;
        border: 1px solid #ccc;
        break-inside: avoid;
      }

      .results-main {
        margin-top: 14px;
      }
    }

    @media (max-width: 900px) {
      .results-grid {
        flex-direction: column;
      }

      .results-sidebar,
      .results-main {
        max-width: 100%;
        flex-basis: auto;
        width: 100%;
      }
    }

    @media (max-width: 768px) {
      body {
        font-size: 0.85rem;
      }

      .nav.nav-pills {
        gap: 8px;
      }

      .nav-item.input-box {
        width: 100%;
      }

      .nav-item.input-box input,
      .nav-item.input-box button {
        width: 100%;
      }

      .custom-modal {
        width: 96vw;
        max-height: 92vh;
      }

      #urinetable,
      #cbctable {
        min-width: 460px;
      }
    }

    @media (max-width: 576px) {
      body {
        font-size: 0.8rem;
      }

      .container {
        padding-left: 8px;
        padding-right: 8px;
      }

      .info-card {
        padding: 12px;
      }

      /* ตารางในการ์ดชนขอบจอเต็มความกว้าง (bleed ออกนอก padding การ์ด) */
      .info-card .table-responsive {
        margin-left: -12px;
        margin-right: -12px;
        width: calc(100% + 24px);
      }

      .info-card .table-responsive .table {
        border-left: 0;
        border-right: 0;
        border-radius: 0;
      }

      .table-sm-custom td,
      .table-sm-custom th {
        font-size: 0.72rem;
        padding: .32rem .28rem;
      }

      #urinetable,
      #cbctable {
        min-width: 420px;
      }

      .header-tools input {
        width: 80% !important;
        flex: 0 0 80%;
      }

      .header-tools .btn {
        height: 44px;
        min-width: 30%;
        padding-left: 0;
        padding-right: 0;
      }

      #searchKey,
      #password {
        max-width: none !important;
      }
    }

    #cbcOverlay,
    #urineOverlay,
    #abnormalOverlay {
      page-break-before: always;
    }
  </style>
</head>

<body>
  <div class="page-wrap">
    <div class="container">
      <header class="app-header">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div class="app-brand">
            <div class="app-brand-icon"><i class="fa-solid fa-notes-medical"></i></div>
            <div>
              <div class="app-title">ระบบค้นหาผลการตรวจสุขภาพประจำปีทางอินเตอร์เน็ต</div>
              <div class="app-subtitle" id="datetime"></div>
            </div>
          </div>

          <div class="header-tools d-flex align-items-center gap-2 noprint flex-wrap">
            <input class="form-control text-center" style="width: 170px;" id="searchKey" placeholder="User ID" />
            <input class="form-control text-center" style="width: 170px;" id="password" type="password" placeholder="Password" />
            <button class="btn btn-teal" type="button" onclick="searchRecord()">Search</button>
            <button type="button" id="printBtn" onclick="printResult()" class="btn btn-secondary" disabled>
              <i class="fa-solid fa-print"></i>
            </button>
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="fa-solid fa-house"></i>
            </a>
          </div>
        </div>
      </header>

      <div id="waiting" class="modal-waiting">
        <div class="waiting-card">
          <div class="d-flex align-items-center gap-3">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="fw-semibold">Data Loading...</div>
          </div>
        </div>
      </div>

      <div id="result" class="result-layout"></div>
    </div>
  </div>

  <!-- CBC MODAL -->
  <div id="cbcOverlay" class="custom-overlay">
    <div class="custom-modal">
      <div class="modal-header d-flex justify-content-between align-items-center">
        <div class="fw-bold">รายละเอียดผล CBC</div>
        <button type="button" class="btn-close" onclick="closeCbc()"></button>
      </div>
      <div class="modal-body">
        <div class="responsive-table-wrap">
          <table id="cbctable" class="table table-bordered table-sm-custom">
            <thead class="table-light">
              <tr>
                <th colspan="2" class="text-center">Test</th>
                <th class="text-center">ค่าที่ได้</th>
                <th class="text-center">ค่าปกติ</th>
              </tr>
            </thead>
            <tbody id="cbcBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <div style="font-size: 0.85rem;" id="cbcSummary"></div>
      </div>
    </div>
  </div>



  <!-- URINE MODAL -->
  <div id="urineOverlay" class="custom-overlay">
    <div class="custom-modal">
      <div class="modal-header d-flex justify-content-between align-items-center">
        <div class="fw-bold">รายละเอียดผลปัสสาวะ</div>
        <button type="button" class="btn-close" onclick="closeUrine()"></button>
      </div>
      <div class="modal-body">
        <div class="responsive-table-wrap">
          <table id="urinetable" class="table table-bordered table-sm-custom">
            <thead class="table-light">
              <tr>
                <th>ผลการตรวจปัสสาวะทั่วไป</th>
                <th class="text-center">ค่าที่ได้</th>
                <th class="text-center">ค่าปกติ</th>
              </tr>
            </thead>
            <tbody id="urineBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
     <!-- Abnormal MODAL -->
  <div id="abnormalOverlay" class="custom-overlay">
    <div class="custom-modal">
      <div class="modal-header d-flex justify-content-between align-items-center">
        <div class="fw-bold">รายละเอียดผลผิดปกติ</div>
        <button type="button" class="btn-close" onclick="closeAbnormal()"></button>
      </div>
      <div class="modal-body">
        <div class="responsive-table-wrap">
         <div id="abnormalResult"></div>
        </div>
      </div>
      <div class="modal-footer">
        <div style="font-size: 0.85rem;" id="cbcSummary"></div>
      </div>
    </div>
  </div>

  <script>
let currentUser = null;
    let currentRegister = "";

    function setDatetime() {
      const el = document.getElementById("datetime");
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleString("th-TH");
    }

    function showWaiting() {
      document.getElementById("waiting").style.display = "flex";
    }

    function hideWaiting() {
      document.getElementById("waiting").style.display = "none";
    }

    function safe(v) {
      return v === null || v === undefined ? "" : v;
    }

    function resultClass(value) {
      return String(value).trim() === "ปกติ" ? "text-body-secondary" : "text-danger";
    }

    function fetchJson(url) {
      return fetch(url).then(response => {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.json();
      });
    }

    function searchRecord() {
      const searchKey = document.getElementById("searchKey").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!searchKey) {
        alert("กรุณากรอก User ID");
        return;
      }

      if (!password) {
        alert("กรุณากรอก Password");
        return;
      }

      showWaiting();

      fetchJson(BASE_URL + "?app=spe&type=main")
        .then(data => {
          const resultDiv1 = document.getElementById("result");
          resultDiv1.innerHTML = "";

          if (!Array.isArray(data) || data.length === 0) {
            resultDiv1.innerHTML = '<div class="alert alert-danger">ไม่พบข้อมูล</div>';
            hideWaiting();
            return;
          }

          const foundUser = data.find(row =>
            String(row.username || "").trim() === searchKey &&
            String(row.pw || "").trim() === password
          );

          if (!foundUser) {
            resultDiv1.innerHTML = '<div class="alert alert-danger">User ID หรือ Password ไม่ถูกต้อง</div>';
            hideWaiting();
            return;
          }

          currentUser = foundUser;
          currentRegister = String(foundUser.register || "").trim();

          resultDiv1.innerHTML = renderMainResult(foundUser);
          document.getElementById("printBtn").disabled = false;

          renderCbcModal(foundUser);
          renderUrineModal(foundUser);

          return searchOutlab(currentRegister);
        })
        .catch(error => {
          console.error("❌ Error fetching data:", error);
          document.getElementById("result").innerHTML = '<div class="alert alert-danger">เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
        })
        .finally(() => {
          hideWaiting();
        });
    }

    function renderMainResult(foundUser) {
      return `
      <div class="results-grid">
        <div class="results-sidebar">

        <div class="info-card patient-card">

  <div class="hospital-row">
    <img 
      src="/${safe(foundUser.logo)}"
      alt="logo"
    >
    <div class="hospital-name">
      ${safe(foundUser.hospital)}
    </div>
  </div>
            <form id="searchForm">
              <div class="field-row">
                <div class="fw-bold">HN :</div>
                <div id="HN">${safe(foundUser.register)}</div>
                <div class="fw-bold">ชื่อ นามสกุล :</div>
                <div>${safe(foundUser.name)}</div>
              </div>

              <div class="line-sep"></div>

              <div class="field-row">
                <div class="fw-bold">อายุ :</div>
                <div>${safe(foundUser.age)} ปี</div>
                <div class="fw-bold">เพศ :</div>
                <div>${safe(foundUser.sex)}</div>
              </div>

              <div class="field-row">
                <div class="fw-bold">น้ำหนัก :</div>
                <div>${safe(foundUser.waigh)} ก.ก.</div>
                <div class="fw-bold">ส่วนสูง :</div>
                <div>${safe(foundUser.tall)} ซ.ม.</div>
                <div class="fw-bold">หมู่โลหิต :</div>
                <div>${safe(foundUser.bg)}</div>
              </div>
            </form>
        </div>

        <div class="info-card vitals-card">
              <div class="section-title">ผลการตรวจสุขภาพทั่วไปโดยแพทย์</div>

              <div class="field-row">
                <div class="fw-bold">ค่า BMI :</div>
                <div>${safe(foundUser.bmiv)}</div>
                <div class="fw-bold">อยู่ในเกณฑ์ :</div>
                <div class="${resultClass(foundUser.bmir)}">${safe(foundUser.bmir)}</div>
              </div>

              <div class="field-row">
                <div class="fw-bold">ค่าความดันโลหิต :</div>
                <div>${safe(foundUser.bp)} mm.Hg</div>
                <div class="fw-bold">การเต้นของชีพจร :</div>
                <div>${safe(foundUser.pause)} ครั้ง/นาที</div>
              </div>

              <div class="field-row">
                <div class="fw-bold">ผลการตรวจปัสสาวะทั่วไป :</div>
                <div class="${resultClass(foundUser.urine)}">${safe(foundUser.urine)}</div>
                <div class="noprint">
                  <span class="click-link" onclick="openUa()">กดดูรายละเอียด</span>
                </div>
              </div>

              <div class="field-row">
                <div class="fw-bold">ผลการเอ็กซเรย์ทรวงอก (Chest X Ray) :</div>
                <div class="${resultClass(foundUser.xray)}">${safe(foundUser.xray)}</div>
              </div>

              <div class="doctor-note">
                <span class="fw-bold">ความเห็นแพทย์ :</span> ${safe(foundUser.doctor)}
              </div>
        </div>

        </div>

        <div class="results-main">

        <div class="info-card">
            <div class="section-title">ผลตรวจทางห้องปฏิบัติการ</div>
            <div class="table-responsive">
              <table class="table table-bordered table-sm-custom">
                <thead class="table-secondary">
                  <tr>
                    <th class="text-center">รายการตรวจ</th>
                    <th class="text-center">ผลตรวจ</th>
                    <th class="text-center">ค่าประมวลผล</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="fw-bold">ความสมบูรณ์ของเม็ดเลือด</td>
                    <td class="text-center ${resultClass(foundUser.cbc)}">${safe(foundUser.cbc)}</td>
                    <td class="text-center noprint"><span class="click-link" onclick="openCbc()">กดดู</span></td>
                  </tr>
                  <tr>
                    <td class="fw-bold">ปริมาณน้ำตาลในเลือด</td>

    function searchOutlab(registerValue) {
      if (!registerValue) {
        document.getElementById("outlab").innerHTML = `
          <tr><td colspan="5" class="text-center text-danger">ไม่พบเลข Register</td></tr>
        `;
        return Promise.resolve();
      }

      return fetchJson(BASE_URL + "?app=spe&type=outlab")
        .then(data => {
          const resultDiv2 = document.getElementById("outlab");
          resultDiv2.innerHTML = "";

          let found = false;

          data.forEach(row => {
            if (String(row.register || "").trim() === String(registerValue).trim()) {
              resultDiv2.innerHTML += `
                <tr>
                  <th scope="row" colspan="3">${safe(row.test)}</th>
                  <td class="text-center">${safe(row.value)}</td>
                  <td class="text-center">${safe(row.result)}</td>
                </tr>
              `;
              found = true;
            }
          });

          if (!found) {
            resultDiv2.innerHTML = `
              <tr><td colspan="5" class="text-center text-danger">ไม่มีรายการตรวจเพิ่มเติมนอกเหนือโปรแกรม</td></tr>
            `;
          }
        })
        .catch(error => {
          console.error("❌ Error fetching outlab:", error);
          document.getElementById("outlab").innerHTML = `
            <tr><td colspan="5" class="text-center text-danger">เกิดข้อผิดพลาดในการดึงข้อมูล</td></tr>
          `;
        });
    }
function loadAbnormal() {
  const hnEl = document.getElementById("HN");
  const resultBox = document.getElementById("abnormalResult");

  if (!hnEl) {
    alert("ไม่พบ element id='HN'");
    return;
  }

  const hn = hnEl.innerText.trim();

  if (hn === "") {
    alert("ไม่พบค่า HN");
    return;
  }

  resultBox.innerHTML = "กำลังโหลดข้อมูล...";
  openAbnormal();

  const url =
    "https://script.google.com/macros/s/AKfycbzWL018ZY35QaHpt-E26L55o4sNxw1Xdh0daZzE-w30LSfxAsMdgDOSBI2SFULYnBiIKA/exec?app=onlinecheck&hn=" +
    encodeURIComponent(hn) +
    "&t=" +
    new Date().getTime();

  fetch(url)
    .then(res => res.json())
    .then(data => {
      if (data.success && Array.isArray(data.abnormal)) {
        resultBox.innerHTML = data.abnormal
          .map((item, index) => `
            <div class="mb-2">
              ${index + 1}. ${item}
            </div>
          `)
          .join("");
      } else if (data.success) {
        resultBox.innerHTML = data.abnormal;
      } else {
        resultBox.innerHTML = data.message;
      }
    })
    .catch(err => {
      console.error(err);
      resultBox.innerHTML = "เกิดข้อผิดพลาด";
    });
}
